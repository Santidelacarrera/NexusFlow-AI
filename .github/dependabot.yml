version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Nest 12 es solo ESM y la API compila a CommonJS: Reflector se duplica y el arranque falla.
      # Se actualiza todo @nestjs/* junto cuando la API migre a ESM.
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']
      # Prisma 7 exige prisma.config.ts y adaptadores de controlador; migración planificada aparte.
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      # TypeScript 7 elimina `baseUrl` de tsconfig (TS5102); migrar la configuración antes de subir de major.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  - package-ecosystem: pip
    directory: /services/ml
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    ignore:
      # Solo Node LTS (las versiones impares no son LTS).
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
    ignore:
      # Solo Node LTS (las versiones impares no son LTS).
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directory: /services/ml
    schedule:
      interval: weekly
