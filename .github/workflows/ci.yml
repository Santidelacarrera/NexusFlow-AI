name: Validate platform
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: nexusflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus-ci-only
          POSTGRES_DB: nexus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test" --health-interval 5s --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run prisma:generate -w @nexusflow/api
      - run: npm run lint
      - run: npm test
      # Motor, seguridad y caso de uso extremo a extremo contra PostgreSQL real.
      - run: npm run prisma:migrate -w @nexusflow/api && npm run test:db -w @nexusflow/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://nexus:nexus-ci-only@localhost:5432/nexus_test?schema=public
          JWT_ACCESS_SECRET: ci-only-jwt-secret-ci-only-jwt-secret-01
          DATA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          AUDIT_HMAC_KEY: ci-only-audit-hmac-key-ci-only-audit-01
          ML_SERVICE_TOKEN: ci-only-ml-token-ci-only-ml-token-0123
      - run: npm run build
      - run: npm run format:check
      - run: npm audit --audit-level=high
      - run: docker compose up --build -d --wait
      - run: docker compose exec -T ml python -m pytest -q -p no:cacheprovider
      - run: docker compose run --rm --no-deps --user root ml sh -c 'pip install --quiet pip-audit && pip-audit -r requirements.lock --no-deps --disable-pip'
      - run: npm run test:smoke
      - run: npm run test:smoke:ml
      - run: npx playwright install --with-deps chromium
      # Smoke + ML usan las tres evaluaciones/minuto permitidas. Conserva el control real en E2E.
      - run: sleep 60
      - run: npm run test:e2e -w @nexusflow/web
      - if: failure()
        run: docker compose logs --tail 100 api ml migrate
      - if: always()
        run: docker compose down
