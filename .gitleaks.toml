description = "Fixtures de CI y pruebas"
regexes = [
  '''ci-only-[A-Za-z0-9-]+''',
  '''nexus-ci-only''',
  '''crm-super-secret-token-\d+''',
  '''Bearer beta-secret-\d+''',
]
